name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(uv version --short)
          if [ "${TAG#v}" != "$version" ]; then
            echo "Release tag $TAG does not match version $version in pyproject.toml" >&2
            exit 1
          fi
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests
      - run: uv build
      - run: python3 -I tests/dist_contents.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/busy-crew/
    permissions:
      id-token: write  # Trusted publishing: no stored PyPI token.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
  homebrew:
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cmdai-hq/homebrew-tap
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Point the formula at the PyPI release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: uv run --locked python scripts/homebrew_formula.py tap/Formula/busy-crew.rb "${TAG#v}" uv.lock
      # Safe to re-run: an update already on main stops here, and the branch and pull request are reused.
      - name: Open the tap pull request, merged once its tests pass
        working-directory: tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          branch="busy-crew-$version"
          if git diff --quiet; then
            echo "The tap's main already has busy-crew $version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git commit -am "busy-crew $version"
          git push --force origin "$branch"  # This bot owns the branch; a re-run replaces its own commit.
          if [ "$(gh pr view "$branch" --json state --jq .state 2>/dev/null)" != "OPEN" ]; then
            gh pr create --base main --head "$branch" --title "busy-crew $version" \
              --body "Release https://github.com/cmdai-hq/busy-crew/releases/tag/$TAG, from its PyPI sdist and uv.lock."
          fi
          gh pr merge "$branch" --auto --squash --delete-branch
