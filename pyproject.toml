[project]
name = "busy-crew"
version = "1.1.0"
description = "Claude and Codex sessions on a BUSY Bar's front LED display"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["busy-bar", "claude-code", "codex", "led", "status", "macos", "menu-bar"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: MacOS X",
  "Intended Audience :: Developers",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Utilities",
]
dependencies = ["busylib==2.6.0", "pillow==12.3.0"]

[project.urls]
Homepage = "https://github.com/cmdai-hq/busy-crew"
Issues = "https://github.com/cmdai-hq/busy-crew/issues"
Source = "https://github.com/cmdai-hq/busy-crew"
Changelog = "https://github.com/cmdai-hq/busy-crew/blob/main/CHANGELOG.md"

[project.scripts]
busy-crew = "agentdeck.cli:main"
# Pre-1.0 command name, kept as an alias.
agent-deck = "agentdeck.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentdeck"]

[dependency-groups]
dev = [
    "packaging>=24",
]
