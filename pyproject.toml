[project]
name = "busybar-agent-deck"
version = "0.1.0"
description = "Claude and Codex sessions on a BUSY Bar's front LED display"
requires-python = ">=3.11"
dependencies = ["busylib==2.6.0", "pillow==12.3.0"]

[project.scripts]
agent-deck = "agentdeck.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentdeck"]
