[project]
name = "busy-crew"
version = "0.1.0"
description = "Claude and Codex sessions on a BUSY Bar's front LED display"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["busylib==2.6.0", "pillow==12.3.0"]

[project.urls]
Homepage = "https://github.com/cmdai-hq/busy-crew"
Issues = "https://github.com/cmdai-hq/busy-crew/issues"
Source = "https://github.com/cmdai-hq/busy-crew"

[project.scripts]
busy-crew = "agentdeck.cli:main"
# Pre-1.0 command name, kept as an alias.
agent-deck = "agentdeck.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentdeck"]
